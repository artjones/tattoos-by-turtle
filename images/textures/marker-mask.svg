<svg xmlns="http://www.w3.org/2000/svg" width="400" height="40" viewBox="0 0 400 40">
  <defs>
    <filter id="rough">
      <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" result="noise"></feTurbulence>
      <feDisplacementMap in="SourceGraphic" in2="noise" scale="4"></feDisplacementMap>
    </filter>
